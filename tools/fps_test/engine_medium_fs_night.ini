; Town05 free-fly, profile "medium_fs_night" (set FREEFLY_INI=medium_fs_night before town05_freefly.bat): medium_fs
; with the street lights' shadows drawn only where they are large on screen. At night the 302 street lights' shadows
; cost about a third of the frame rate (demo at 22:00: 30.2 -> 44.9 fps flying high, the picture looks the same), but
; the traffic cameras then find fewer emergency vehicles with their lights on at night (18-19 -> 12-13 of 60 in
; tools\look_detector_check.bat), so it is not the default. docs/WORKLOG.md 11 Nov.
; medium_fs: CARLA's Epic quality with the expensive and barely visible
; parts reduced, the picture rendered at 80 % of the screen in each direction and upscaled (TAAU): 1536x864 on a
; 1920x1080 screen. Until 11 Nov: 58 % (engine_medium_fs_10nov.ini). Measured with the town's traffic, the frame rate
; does not depend on the resolution up to 88 % (the viewer waits for the CPU, not the GPU), docs/WORKLOG.md 11 Nov.
[SystemSettings]
r.Streaming.PoolSize=1200
r.Streaming.LimitPoolSizeToVRAM=1
r.ScreenPercentage=80
r.TemporalAA.Upsampling=1
; a sharper filter for the temporal anti-aliasing. No r.Tonemapper.Sharpen: it also sharpens the traffic cameras'
; pictures, and the detector then finds fewer vehicles (0.64 -> 0.59 of the labelled objects, more false boxes;
; tools\look_detector_check.bat, docs/WORKLOG.md 11 Nov)
r.TemporalAACatmullRom=1
r.TemporalAAFilterSize=0.6
r.DefaultFeature.MotionBlur=0
r.MotionBlurQuality=0
; reflections on the glass towers and the cars
r.SSR.Quality=2
r.DistanceFieldAO=0
r.DepthOfFieldQuality=0
r.LensFlareQuality=0
r.SceneColorFringeQuality=0
r.VolumetricFog=0
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=0.7
r.Shadow.RadiusThreshold=0.06
r.Shadow.FadeResolution=256
r.Shadow.MinResolution=128
r.Shadow.TexelsPerPixelSpotlight=0.5
r.Shadow.TexelsPerPixelPointlight=0.5
r.ViewDistanceScale=0.7
r.StaticMeshLODDistanceScale=1.5
foliage.DensityScale=0.5
grass.DensityScale=0.5
r.MaxAnisotropy=8
