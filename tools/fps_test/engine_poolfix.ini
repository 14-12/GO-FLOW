
; Town05 FPS test, profile "poolfix": only the texture pool fixed.
; CARLA's DefaultEngine.ini asks for a 4000 MB texture pool, on a 4096 MB GPU; at Epic quality CARLA
; never lowers it, so textures are evicted and loaded again all the time (stutter, full GPU memory).
[SystemSettings]
r.Streaming.PoolSize=1200
r.Streaming.LimitPoolSizeToVRAM=1
